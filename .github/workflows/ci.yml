name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check shell syntax
        run: |
          bash -n D-step.sh BPP-step.sh
          for f in upstream/annotation_curation/*.sh upstream/gene_content_tree/*.sh; do
            bash -n "$f"
          done

      - name: Compile Python utilities
        run: |
          python -m py_compile cal_b10.py cal_marginal_likelihoods.py
          python -m py_compile upstream/annotation_curation/scripts/*.py
          python -m py_compile upstream/gene_content_tree/scripts/*.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
